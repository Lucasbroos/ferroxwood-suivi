<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ferroxwood — Suivi des demandes</title>
<style>
:root{--bg:#f4f3ef;--ink:#252b28;--muted:#7a807c;--green:#355b45;--line:#e5e7e0;--orange:#b47746}*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button,a{cursor:pointer}button{border:1px solid var(--line);background:white;border-radius:8px;padding:10px 14px;color:var(--ink)}button:hover{background:#eaf0e8}button:disabled{opacity:.5;cursor:not-allowed}button.primary{background:var(--green);color:white;border-color:var(--green)}button:focus-visible,a:focus-visible{outline:3px solid #b47746;outline-offset:2px}.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}aside{background:#222d27;color:#fff;padding:32px 20px;display:flex;flex-direction:column;gap:30px}.brand{font-size:23px;font-weight:800;letter-spacing:2px}.brand small{display:block;font-size:10px;color:#b0bcb3;font-weight:400;letter-spacing:3px;margin-top:8px}.nav{display:grid;gap:8px}.nav button{text-align:left;background:transparent;color:#bbc6be;border:0;padding:13px 16px}.nav button.active{color:white;background:#3b4c41}.profile{margin-top:auto;border-top:1px solid #455148;padding-top:22px;color:#b8c5bc;font-size:12px;word-break:break-all}.profile button{margin-top:12px;background:transparent;color:#b8c5bc;border-color:#455148;padding:7px 11px;font-size:12px}main{padding:34px 38px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;gap:15px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}h1{font-size:30px;letter-spacing:-1px;font-weight:650;margin:7px 0}h2{font-size:18px;margin:0 0 20px}p{line-height:1.6}.sub{color:var(--muted)}.demo{padding:12px 16px;background:#e9eddf;border:1px solid #dbe2cd;border-radius:8px;font-size:12px;margin-bottom:26px;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:24px 0}.stat{text-align:left;padding:20px;background:white;border:1px solid var(--line);border-radius:12px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:32px;margin:12px 0 5px;font-weight:600}.stat span{color:var(--green);font-size:11px}.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:11px;background:white;color:var(--ink);max-width:100%}input[readonly]{background:#f7f8f5}input[type=search]{flex:1;min-width:180px}textarea{width:100%;resize:vertical;min-height:95px}.table-wrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);background:#fafbf8;padding:16px}td{padding:17px 16px;border-top:1px solid var(--line);font-size:12px}tbody tr{cursor:pointer}tbody tr:hover{background:#fafbf6}td strong{display:block;font-size:13px;margin-bottom:5px}td small{color:var(--muted)}.badge{display:inline-block;padding:6px 9px;border-radius:5px;font-size:11px;background:#eff1ed;color:#5f6b61}.badge.new{background:#e9eee1;color:#5c723d}.badge.sent{background:#e5edf0;color:#416573}.badge.win,.badge.ok{background:#dce9df;color:#355b45}.badge.lost,.badge.ko{background:#f1e4df;color:#975b46}.danger{color:#a55f43}.row{display:flex;justify-content:space-between;align-items:center;gap:14px;border-top:1px solid var(--line);padding:16px 0}.row:first-of-type{border-top:0}.row strong{display:block;margin-bottom:5px}.row small{color:var(--muted)}.empty{padding:36px;text-align:center;color:var(--muted)}.kanban{display:flex;gap:14px;overflow:auto;padding-bottom:20px}.lane{min-width:235px;flex:1;background:#eaece5;border-radius:10px;padding:14px}.lane h3{font-size:12px;margin:2px 0 18px}.card{display:block;width:100%;text-align:left;background:white;padding:17px;margin-bottom:10px;border:1px solid var(--line);border-radius:8px}.card strong{display:block;margin:12px 0 6px}.card small{color:var(--muted)}.card footer{margin-top:18px;font-size:11px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.integration{padding:18px;border:1px solid var(--line);border-radius:8px;margin:12px 0}.integration strong{display:block;margin-bottom:6px}.integration small{display:block;color:var(--muted);margin-top:8px}dialog{border:0;padding:0;border-radius:16px;width:min(850px,94vw);max-height:92vh;box-shadow:0 24px 90px #0003;color:var(--ink)}dialog::backdrop{background:#17231d80;backdrop-filter:blur(3px)}.modalhead{padding:25px 28px;background:#f5f6f1;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.modalbody{padding:26px 28px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:17px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.field input,.field select{width:100%}.full{grid-column:1/-1}.field label.check{display:flex;gap:10px;align-items:flex-start;margin:6px 0 14px;font-size:13px;color:var(--ink)}.field label.check input{width:auto;margin-top:3px}.field label.check small{font-size:12px}.nav button{display:flex;align-items:center;gap:0}.navcount{margin-left:auto!important;display:inline-block;background:#b47746;color:#fff;border-radius:9px;padding:1px 7px;font-size:11px;margin-left:6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.actions a{display:inline-block;color:var(--green);text-decoration:none;border:1px solid var(--line);padding:10px 14px;border-radius:8px}.timeline{font-size:12px;border-left:2px solid #dce4d7;padding-left:17px}.timeline p{margin:12px 0;white-space:pre-line}.timeline small{color:var(--muted)}.toast{position:fixed;bottom:25px;right:25px;background:#25382c;color:white;padding:16px 23px;border-radius:9px;z-index:30;max-width:90vw}.hidden{display:none!important}.amount{font-size:26px;color:var(--green)}code{background:#eef0ea;padding:1px 5px;border-radius:4px;font-size:12px}
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}.gatecard{background:white;border:1px solid var(--line);border-radius:16px;padding:36px;width:min(420px,100%)}.gatecard .brand{color:var(--ink);margin-bottom:28px}.gatecard .brand small{color:var(--muted)}.gatecard input{width:100%}.spinner{color:var(--muted);text-align:center}
@media(max-width:1000px){.app{grid-template-columns:190px 1fr}main{padding:25px}.cols{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{display:block}aside{padding:17px;gap:16px}.brand{font-size:18px}aside .brand small,.profile{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;font-size:12px;padding:10px}main{padding:20px 15px}.top{align-items:flex-start;flex-wrap:wrap}h1{font-size:24px}.stats{gap:9px}.stat{padding:15px}.stat strong{font-size:26px}.settings-grid,.fields{grid-template-columns:1fr}.full{grid-column:auto}.modalbody{padding:20px}.toolbar>*{flex:1}.panel{padding:18px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head><body>
<div id="gate" class="gate"><div class="gatecard" id="gateCard"><p class="spinner">Chargement…</p></div></div>
<div class="app hidden" id="app"><aside><div class="brand">FERROXWOOD<small>ATELIER · SUIVI COMMERCIAL</small></div><nav class="nav" id="nav"></nav><div class="profile" id="profile"></div></aside><main><header class="top"><div><div class="eyebrow">Espace de travail / Ferroxwood</div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div><div style="display:flex;gap:8px"><button id="refresh" title="Actualiser" aria-label="Actualiser">↻</button><button class="primary" id="add">＋ Nouvelle demande</button></div></header><div id="content"></div></main></div>
<dialog id="modal"><div id="modalContent"></div></dialog><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statuses=['Nouvelle demande','À contacter','Contact tenté, sans réponse','Échange en cours','Informations ou visite à prévoir','Devis à préparer','Devis envoyé','Devis accepté','Devis refusé','Dossier clôturé'];
const types=['Portail','Garde-corps','Escalier','Porte','Terrasse suspendue','Carport','Mobilier','Autre'];
const SOURCES=['Meta','Site web','Ajout manuel'];
const CLOSED=['Devis accepté','Devis refusé','Dossier clôturé'];
const closed=d=>CLOSED.includes(d.status);
const today=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Brussels'});
const shift=(n,base=today())=>{let d=new Date(base+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+Number(n));return d.toISOString().slice(0,10)};
const date=v=>v?new Date(String(v).slice(0,10)+'T12:00:00Z').toLocaleDateString('fr-BE',{timeZone:'UTC'}):'—';
const datetime=v=>v?new Date(v).toLocaleString('fr-BE',{timeZone:'Europe/Brussels',dateStyle:'short',timeStyle:'short'}):'—';
const money=v=>new Intl.NumberFormat('fr-BE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(v)||0);
const GENERIC_BODY='Bonjour {prenom},\n\nMerci pour votre demande concernant votre projet « {projet} ». Quand seriez-vous disponible pour en discuter ?\n\nBelle journée,\n{signature}';

// Correspondance champs interface ↔ colonnes Supabase
const MAP={name:'name',project:'project',type:'type',city:'city',source:'source',status:'status',created:'received_on',budget:'budget',message:'message',email:'email',phone:'phone',owner:'owner',amount:'amount',ref:'quote_ref',sent:'sent_on',next:'next_on',action:'next_action',notes:'notes',lastReminder:'last_reminder_on',suspended:'suspended',reminders:'reminders',reminderOverride:'reminder_override_on',draft:'draft',pdfPath:'pdf_path',pdfName:'pdf_name'};
const DATE_KEYS=new Set(['created','sent','next','lastReminder','reminderOverride']),NUM_KEYS=new Set(['budget','amount']);

let sb,session=null,cfg={},allowed=false,lastLoad=0,db=[];
let config={first:7,second:7,signature:'',auto_send:false,attach_pdf:true,notify_email:'',subject_1:'',body_1:'',subject_2:'',body_2:'',last_cron_at:null};
let page='Tableau de bord',mode='table',filter='',source='',query='',sort='recent';

function fromRow(r,events){const d={id:r.id,code:'FW-'+String(r.number).padStart(3,'0'),createdAt:r.created_at};for(const[k,c]of Object.entries(MAP)){const v=r[c];d[k]=v==null?(k==='suspended'?false:k==='reminders'?0:''):v}d.history=(events||[]).filter(e=>e.lead_id===r.id).map(e=>({at:e.at,text:e.text,author:e.author}));return d}
function toDb(p){const o={};for(const[k,v]of Object.entries(p)){if(!(k in MAP))continue;let x=v;if(DATE_KEYS.has(k))x=v?v:null;else if(NUM_KEYS.has(k))x=(v===''||v==null)?null:Number(v);else if(k==='suspended')x=!!v;else if(k==='reminders')x=Number(v)||0;else if(typeof v==='string')x=v.trim()||null;o[MAP[k]]=x}if(o.name===null)delete o.name;if(o.project===null)delete o.project;o.updated_at=new Date().toISOString();return o}
const byId=id=>db.find(d=>d.id===id);

function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.add('hidden'),4500)}
function badge(d){return '<span class="badge '+(d.status==='Nouvelle demande'?'new':d.status==='Devis envoyé'?'sent':d.status==='Devis accepté'?'win':d.status==='Devis refusé'?'lost':'')+'">'+esc(d.status)+'</span>'}
function due(d){if(closed(d)||d.suspended||d.status!=='Devis envoyé'||!d.sent||!d.email||d.reminders>=2)return '';return d.reminderOverride||(d.lastReminder?shift(Number(config.second),d.lastReminder):shift(Number(config.first),d.sent))}
function reminders(){return db.filter(d=>due(d)&&due(d)<=today())}
function upcoming(){return db.filter(d=>due(d)&&due(d)>today()).sort((a,b)=>due(a).localeCompare(due(b)))}
function tasks(){return db.filter(d=>d.next&&!closed(d)).sort((a,b)=>a.next.localeCompare(b.next))}
function tpl(t,d){const v={prenom:String(d.name||'').trim().split(/\s+/)[0]||'',nom:d.name,projet:d.project,ref:d.ref,date_envoi:date(d.sent),montant:d.amount?money(d.amount):'',signature:config.signature};return String(t||'').replace(/\{(\w+)\}/g,(m,k)=>k in v?(v[k]??''):m)}

// ---------- Supabase ----------
async function boot(){
  try{cfg=await(await fetch('/api/config')).json()}catch(e){return gate('<h2>Configuration introuvable</h2><p class="sub">La route /api/config ne répond pas. Vérifiez le déploiement Vercel.</p>')}
  if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)return gate('<h2>Configuration incomplète</h2><p class="sub">Ajoutez SUPABASE_URL et SUPABASE_ANON_KEY dans les variables d’environnement Vercel, puis redéployez.</p>');
  sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  const{data}=await sb.auth.getSession();session=data.session;
  sb.auth.onAuthStateChange((_e,s)=>{const was=!!session;session=s;if(!!s!==was)start()});
  start();
}
async function start(){if(!session)return loginView();gate('<p class="spinner">Chargement des dossiers…</p>');await loadAll();if(!allowed)return deniedView();$('#gate').classList.add('hidden');$('#app').classList.remove('hidden');render()}
async function loadAll(){
  const[s,l,e]=await Promise.all([sb.from('settings').select('*').eq('id',1).maybeSingle(),sb.from('leads').select('*').order('received_on',{ascending:false}).order('created_at',{ascending:false}),sb.from('lead_events').select('lead_id,at,text,author').order('at',{ascending:false}).limit(10000)]);
  const err=s.error||l.error||e.error;if(err)toast('Erreur de chargement : '+err.message);
  allowed=!!s.data;
  if(s.data)config={...config,...s.data,first:s.data.first_delay,second:s.data.second_delay};
  db=(l.data||[]).map(r=>fromRow(r,e.data));lastLoad=Date.now();
}
async function persist(d,patch,logs=[]){
  if(typeof logs==='string')logs=[logs];
  const{error}=await sb.from('leads').update(toDb(patch)).eq('id',d.id);
  if(error){toast('Erreur : '+error.message);return false}
  Object.assign(d,patch);
  if(logs.length){const rows=logs.map(t=>({lead_id:d.id,text:t,author:session.user.email}));const r=await sb.from('lead_events').insert(rows);if(!r.error)rows.forEach(x=>d.history.unshift({at:new Date().toISOString(),text:x.text,author:x.author}))}
  return true;
}
async function api(path,body){
  const{data}=await sb.auth.getSession();
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(data.session?.access_token||'')},body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||('Erreur '+r.status));return j;
}

// ---------- Connexion ----------
function gate(html){$('#app').classList.add('hidden');$('#gate').classList.remove('hidden');$('#gateCard').innerHTML='<div class="brand">FERROXWOOD<small>SUIVI COMMERCIAL</small></div>'+html}
function loginView(){gate('<h2>Connexion</h2><p class="sub">Entrez votre adresse email : vous recevrez un lien de connexion.</p><form id="loginForm"><input type="email" name="email" required autocomplete="email" placeholder="vous@ferroxwood.be"><p><button class="primary" style="width:100%">Recevoir le lien</button></p></form><p class="sub" id="loginMsg"></p>');
  $('#loginForm').onsubmit=async e=>{e.preventDefault();const email=new FormData(e.target).get('email').trim().toLowerCase();e.target.querySelector('button').disabled=true;const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});e.target.querySelector('button').disabled=false;$('#loginMsg').textContent=error?'Erreur : '+error.message:'Lien envoyé à '+email+'. Ouvrez-le sur cet appareil.'}}
function deniedView(){gate('<h2>Accès non autorisé</h2><p class="sub">Le compte '+esc(session.user.email)+' n’est pas encore autorisé. Demandez à Upper Agency de vous ajouter.</p><button id="logout2">Se déconnecter</button>');$('#logout2').onclick=()=>sb.auth.signOut()}

// ---------- Rendu ----------
function go(p,f=''){page=p;filter=f;source='';query='';render()}
function render(){
  const pages=['Tableau de bord','Demandes','Devis','Rappels et relances','Paramètres'];
  $('#nav').innerHTML=pages.map((p,i)=>'<button data-page="'+p+'" class="'+(p===page?'active':'')+'">'+['◈','▤','▧','◷','⚙'][i]+' &nbsp; '+p+(p==='Rappels et relances'&&reminders().length?'<span class="navcount">'+reminders().length+'</span>':'')+'</button>').join('');
  $('#profile').innerHTML=esc(session.user.email)+'<br><button id="logout">Se déconnecter</button>';
  $('#title').textContent=page;
  $('#subtitle').textContent={'Tableau de bord':'Une vue claire de vos projets et de vos prochaines actions.','Demandes':'Toutes vos demandes, un seul espace.','Devis':'Suivez vos propositions et les réponses de vos clients.','Rappels et relances':'Le bon suivi, au bon moment.','Paramètres':'Délais, emails de relance et connexions.'}[page];
  $('#content').innerHTML=page==='Tableau de bord'?dashboard():page==='Paramètres'?settings():page==='Rappels et relances'?reminderPage():listPage();
  bind();
}
function dashboard(){const total=db.filter(d=>d.status==='Devis accepté').reduce((s,d)=>s+Number(d.amount||0),0);const r=reminders().length;
  return '<div class="stats">'+[['Nouvelles demandes',db.filter(d=>d.status==='Nouvelle demande').length,'Nouvelle demande','À prendre en charge'],['Devis en attente',db.filter(d=>d.status==='Devis envoyé').length,'Devis envoyé','En attente de réponse'],['Devis à préparer',db.filter(d=>d.status==='Devis à préparer').length,'Devis à préparer','Prochaine étape'],['Devis acceptés',db.filter(d=>d.status==='Devis accepté').length,'Devis accepté','Projets confirmés']].map(a=>'<button class="stat" data-filter="'+a[2]+'"><small>'+a[0]+'</small><strong>'+a[1]+'</strong><span>'+a[3]+' ↗</span></button>').join('')+'</div><div class="cols"><section class="panel"><h2>Mes prochaines actions</h2>'+taskRows(tasks().slice(0,5))+'</section><section class="panel"><div class="eyebrow">À suivre</div><h2 style="margin-top:12px">'+r+' relance(s) '+(config.auto_send?'prévue(s)':'à valider')+'</h2><p class="sub">'+(config.auto_send?'Envoi automatique chaque matin pour les devis restés sans réponse.':'Emails préparés pour les devis restés sans réponse : relisez et envoyez en un clic.')+'</p><button class="primary" data-page="Rappels et relances">Voir les relances →</button><hr style="border:0;border-top:1px solid var(--line);margin:28px 0"><small class="sub">Montant des devis acceptés</small><p class="amount">'+money(total)+'</p></section></div><section><h2>Dernières demandes</h2>'+table(db.slice().sort((a,b)=>(b.created+b.createdAt).localeCompare(a.created+a.createdAt)).slice(0,5))+'</section>'}
function taskRows(rows){return rows.length?rows.map(d=>'<div class="row"><div><strong>'+esc(d.project)+'</strong><small>'+esc(d.name)+' · '+esc(d.action||'Rappel')+'</small></div><button data-open="'+d.id+'" class="'+(d.next<today()?'danger':'')+'">'+date(d.next)+(d.next<today()?' · En retard':'')+' →</button></div>').join(''):'<div class="empty">Aucune action programmée.</div>'}
function listPage(){return '<div class="toolbar"><input id="search" type="search" placeholder="Rechercher un nom, projet, ville, référence…" value="'+esc(query)+'"><select id="status"><option value="">Tous les statuts</option>'+statuses.map(s=>'<option '+(filter===s?'selected':'')+'>'+s+'</option>').join('')+'</select><select id="source"><option value="">Toutes les sources</option>'+SOURCES.map(s=>'<option '+(source===s?'selected':'')+'>'+s+'</option>').join('')+'</select><select id="sort"><option value="recent">Plus récentes</option><option value="old">Plus anciennes</option></select><button id="mode">'+(mode==='table'?'Vue Kanban':'Vue tableau')+'</button><button id="export">Exporter CSV</button></div><div id="results">'+results()+'</div>'}
function selected(){return db.filter(d=>(!filter||d.status===filter)&&(!source||d.source===source)&&(!query||[d.code,d.name,d.project,d.city,d.ref,d.email,d.phone].join(' ').toLowerCase().includes(query.toLowerCase()))&&(page!=='Devis'||d.ref||['Devis à préparer','Devis envoyé','Devis accepté','Devis refusé'].includes(d.status))).sort((a,b)=>sort==='recent'?b.created.localeCompare(a.created):a.created.localeCompare(b.created))}
function results(){const rows=selected();if(mode==='table')return table(rows);return '<div class="kanban">'+statuses.filter(s=>!filter||s===filter).map(s=>'<section class="lane"><h3>'+s+' · '+rows.filter(d=>d.status===s).length+'</h3>'+rows.filter(d=>d.status===s).map(d=>'<button class="card" data-open="'+d.id+'"><span class="badge">'+esc(d.source)+'</span><strong>'+esc(d.project)+'</strong><small>'+esc(d.name)+' · '+esc(d.city)+'</small><footer>'+money(d.amount||d.budget)+' · '+date(d.created)+'</footer></button>').join('')+'</section>').join('')+'</div>'}
function table(rows){return rows.length?'<div class="table-wrap"><table><thead><tr><th>Client / projet</th><th>Source</th><th>Statut</th><th>Budget / devis</th><th>Prochaine action</th><th>Reçu le</th></tr></thead><tbody>'+rows.map(d=>'<tr data-open="'+d.id+'" tabindex="0" role="button" aria-label="Ouvrir '+esc(d.project)+'"><td><strong>'+esc(d.name)+'</strong><small>'+esc(d.project)+'</small></td><td><span class="badge">'+esc(d.source)+'</span></td><td>'+badge(d)+(due(d)&&due(d)<=today()?'<br><small class="danger">Relance due</small>':'')+'</td><td>'+(d.budget?money(d.budget):'—')+'<br><small>Devis : '+(d.amount?money(d.amount):'—')+'</small></td><td class="'+(d.next&&d.next<today()&&!closed(d)?'danger':'')+'">'+(closed(d)?'Dossier terminé':d.next?date(d.next)+'<br><small>'+esc(d.action)+'</small>':'À programmer')+'</td><td>'+date(d.created)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="panel empty">Aucun dossier ne correspond à votre recherche.</div>'}
function reminderPage(){const r=reminders(),u=upcoming();
  return '<div class="cols"><section class="panel"><h2>Rappels programmés</h2>'+taskRows(tasks())+'</section><section class="panel"><h2>Relances '+(config.auto_send?'du jour':'à valider')+' · '+r.length+'</h2>'+(r.length?r.map(d=>'<div class="row"><div><strong>'+esc(d.name)+'</strong><small>'+esc(d.ref)+' · relance '+(d.reminders+1)+' · échéance '+date(due(d))+'</small></div><button class="primary" data-draft="'+d.id+'">'+(config.auto_send?'Voir':'Préparer')+'</button></div>').join(''):'<div class="empty">Vous êtes à jour.</div>')+'<p class="sub">'+(config.auto_send?'Mode automatique : ces relances partent lors du passage quotidien (vers 9 h).':'Mode validation : ouvrez chaque relance, relisez-la puis cliquez « Envoyer ».')+' Réglage dans Paramètres.</p>'+(u.length?'<h2 style="margin-top:28px">À venir · '+u.length+'</h2>'+u.slice(0,8).map(d=>'<div class="row"><div><strong>'+esc(d.name)+'</strong><small>'+esc(d.ref)+' · relance '+(d.reminders+1)+'</small></div><button data-open="'+d.id+'">'+date(due(d))+' →</button></div>').join(''):'')+'</section></div>'}
function settings(){const lastImport=db.filter(d=>d.source!=='Ajout manuel').map(d=>d.createdAt).sort().pop();
  const conn=(t,ok,detail)=>'<div class="integration"><strong>'+t+'</strong><span class="badge '+(ok?'ok':'ko')+'">'+(ok?'Connecté':'À configurer')+'</span><small>'+detail+'</small></div>';
  return '<div class="settings-grid"><section class="panel"><h2>Relances automatiques</h2><form id="settingsForm"><div class="fields">'+field('1re relance · jours après l’envoi du devis','first',config.first,'number')+field('2e relance · jours après la 1re','second',config.second,'number')+'<div class="field full"><label class="check"><input type="checkbox" name="auto_send" '+(config.auto_send?'checked':'')+'><span><b>Envoi 100 % automatique</b><br><small class="sub">Décoché : les relances sont préparées et vous les validez en un clic.</small></span></label><label class="check"><input type="checkbox" name="attach_pdf" '+(config.attach_pdf?'checked':'')+'><span>Joindre le PDF du devis aux relances (si ajouté au dossier)</span></label></div>'+field('Récap quotidien envoyé à (virgules entre adresses)','notify_email',config.notify_email||'','text','','full')+'<div class="field full"><label>Signature</label><textarea name="signature">'+esc(config.signature)+'</textarea></div>'+field('Objet · relance 1','subject_1',config.subject_1,'text','','full')+'<div class="field full"><label>Message · relance 1</label><textarea name="body_1" style="min-height:200px">'+esc(config.body_1)+'</textarea></div>'+field('Objet · relance 2','subject_2',config.subject_2,'text','','full')+'<div class="field full"><label>Message · relance 2</label><textarea name="body_2" style="min-height:200px">'+esc(config.body_2)+'</textarea></div></div><p class="sub">Variables : <code>{prenom}</code> <code>{nom}</code> <code>{projet}</code> <code>{ref}</code> <code>{date_envoi}</code> <code>{montant}</code> <code>{signature}</code>. Maximum 2 relances par devis ; un devis accepté, refusé, clôturé ou suspendu n’est plus relancé.</p><button class="primary">Enregistrer</button></form></section><section class="panel"><h2>Connexions</h2>'+conn('Google Sheet · leads Meta et site',!!lastImport,lastImport?'Dernière demande importée : '+datetime(lastImport):'Aucune demande importée pour l’instant (Apps Script à installer).')+conn('Envoi des emails',cfg.mail,cfg.mail?'Expéditeur : '+esc(cfg.mailFrom):'Ajoutez RESEND_API_KEY et MAIL_FROM sur Vercel.')+conn('Passage quotidien des relances',!!config.last_cron_at,config.last_cron_at?'Dernier passage : '+datetime(config.last_cron_at):'Pas encore exécuté.')+'<p><button id="runNow">Lancer la vérification maintenant</button></p><p class="sub">La vérification manuelle applique le mode choisi (automatique ou validation) mais n’envoie pas le récap quotidien.</p></section></div>'}
function field(label,name,value,type='text',extra='',cls=''){return '<div class="field '+cls+'"><label for="f-'+name+'">'+label+'</label><input id="f-'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(type==='number'?'min="0" step="any"':'')+' '+extra+'></div>'}
function options(arr,val){return arr.map(s=>'<option '+(s===val?'selected':'')+'>'+esc(s)+'</option>').join('')}

// ---------- Fiche dossier ----------
function open(id){const d=byId(id);if(!d)return;
  $('#modalContent').innerHTML='<div class="modalhead"><div><div class="eyebrow">'+d.code+' · '+esc(d.source)+'</div><h2 style="margin:8px 0 0">'+esc(d.project)+'</h2></div><button data-close aria-label="Fermer">✕</button></div><div class="modalbody"><form id="dossierForm"><div class="fields">'+field('Nom du client','name',d.name)+field('Nom du projet','project',d.project)+field('Email','email',d.email,'email')+field('Téléphone','phone',d.phone,'tel')+field('Localité','city',d.city)+field('Responsable','owner',d.owner)+'<div class="field"><label>Type de projet</label><select name="type">'+options(types,d.type)+'</select></div><div class="field"><label>Statut</label><select name="status">'+options(statuses,d.status)+'</select></div>'+field('Budget annoncé (€)','budget',d.budget,'number')+field('Montant du devis (€)','amount',d.amount,'number')+field('Référence du devis','ref',d.ref)+field('Date d’envoi du devis','sent',d.sent,'date')+field('Prochaine action','action',d.action)+field('Date du rappel','next',d.next,'date')+'<div class="field full"><label>Message du client</label><textarea name="message">'+esc(d.message)+'</textarea></div><div class="field full"><label>Notes internes</label><textarea name="notes">'+esc(d.notes)+'</textarea></div><div class="field full"><label>Devis PDF (max. 10 Mo)</label><input type="file" id="pdfFile" accept="application/pdf">'+(d.pdfPath?'<p><button type="button" id="downloadPdf">Ouvrir '+esc(d.pdfName||'le devis')+'</button></p>':'')+'</div></div><div class="actions"><button class="primary">Enregistrer les modifications</button><button type="button" id="completeTask">Action terminée</button></div></form><div class="actions">'+(d.phone?'<a href="tel:'+esc(String(d.phone).replace(/[^+\d]/g,''))+'">Appeler</a>':'')+'<button id="contact">Enregistrer un contact</button><button id="noanswer">Sans réponse</button><button id="draft">Rédiger un email / relance</button><button id="markSent">Devis envoyé aujourd’hui</button><button id="suspend">'+(d.suspended?'Reprendre les relances':'Suspendre les relances')+'</button></div><p class="sub">'+(due(d)?'Prochaine relance : '+date(due(d))+' (relance '+(d.reminders+1)+'/2).':d.status==='Devis envoyé'?(d.suspended?'Relances suspendues.':d.reminders>=2?'Les 2 relances ont été envoyées.':!d.email?'Ajoutez un email pour activer les relances.':''):'Les relances démarrent quand le statut passe à « Devis envoyé ».')+'</p><h2>Historique</h2><div class="timeline">'+(d.history.length?d.history.map(h=>'<p>'+esc(h.text)+'<br><small>'+datetime(h.at)+(h.author?' · '+esc(h.author):'')+'</small></p>').join(''):'<p class="sub">Aucun événement.</p>')+'</div></div>';
  if(!$('#modal').open)$('#modal').showModal();bindModal(d)}
function bindModal(d){
  $('#modal [data-close]').onclick=()=>$('#modal').close();
  $('#dossierForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button.primary');const v=Object.fromEntries(new FormData(e.target)),file=$('#pdfFile').files[0];
    if(!v.name.trim()||!v.project.trim())return toast('Renseignez le nom du client et le projet.');
    const patch={...v},logs=[];
    if(d.status!==v.status){logs.push('Statut : '+v.status);if(v.status==='Devis envoyé'){if(!v.sent)patch.sent=today();Object.assign(patch,{reminders:0,lastReminder:'',reminderOverride:'',suspended:false})}}
    if(CLOSED.includes(v.status)){patch.next='';patch.action=''}
    if(patch.status==='Devis envoyé'&&!String(v.ref).trim())return toast('Ajoutez la référence du devis.');
    btn.disabled=true;
    if(file){if(file.size>10*1024*1024){btn.disabled=false;return toast('Le PDF doit peser moins de 10 Mo.')}if(file.type!=='application/pdf'){btn.disabled=false;return toast('Choisissez un fichier PDF.')}
      const path=d.id+'/'+Date.now()+'-'+file.name.replace(/[^\w.-]+/g,'_');const up=await sb.storage.from('devis').upload(path,file,{contentType:'application/pdf'});if(up.error){btn.disabled=false;return toast('Échec de l’envoi du PDF : '+up.error.message)}patch.pdfPath=path;patch.pdfName=file.name;logs.push('Devis PDF ajouté : '+file.name)}
    logs.push('Fiche mise à jour');
    const ok=await persist(d,patch,logs);btn.disabled=false;if(ok){$('#modal').close();render();toast('Dossier enregistré')}};
  $('#contact').onclick=()=>update(d,{status:'Échange en cours'},'Contact effectué');
  $('#noanswer').onclick=()=>update(d,{status:'Contact tenté, sans réponse',action:'Rappeler le client',next:shift(3)},'Contact tenté · aucune réponse');
  $('#completeTask').onclick=()=>update(d,{next:'',action:''},'Action terminée');
  $('#suspend').onclick=()=>update(d,{suspended:!d.suspended},d.suspended?'Relances reprises':'Relances suspendues');
  $('#draft').onclick=()=>draft(d.id);
  $('#markSent').onclick=()=>{if(!d.ref||!d.amount)return toast('Enregistrez d’abord la référence et le montant du devis.');update(d,{status:'Devis envoyé',sent:today(),reminders:0,lastReminder:'',reminderOverride:'',suspended:false},'Devis envoyé le '+date(today())+' · relances programmées')};
  if($('#downloadPdf'))$('#downloadPdf').onclick=async()=>{const{data,error}=await sb.storage.from('devis').createSignedUrl(d.pdfPath,120);if(error)return toast('PDF introuvable : '+error.message);window.open(data.signedUrl,'_blank','noopener')}}
async function update(d,v,t){if(await persist(d,v,t)){render();open(d.id)}}

// ---------- Email / relance ----------
function draft(id){const d=byId(id);const isQuote=d.status==='Devis envoyé'&&!!d.sent&&d.reminders<2;const n=Math.min(d.reminders+1,2);
  const subject=isQuote?tpl(config['subject_'+n],d):'Votre projet '+d.project+' – Ferroxwood';
  const body=d.draft||(isQuote?tpl(config['body_'+n],d):tpl(GENERIC_BODY,d));
  const canSend=cfg.mail&&!!d.email;
  $('#modalContent').innerHTML='<div class="modalhead"><div><div class="eyebrow">'+d.code+' · '+(isQuote?'Relance '+n+'/2':'Email')+'</div><h2 style="margin:8px 0 0">'+esc(d.name)+'</h2></div><button data-close aria-label="Fermer">✕</button></div><div class="modalbody">'+(!cfg.mail?'<div class="demo">L’envoi d’emails n’est pas encore configuré : vous pouvez copier ce message.</div>':!d.email?'<div class="demo">Ce dossier n’a pas d’adresse email. Ajoutez-la dans la fiche.</div>':'')+'<div class="fields">'+field('Destinataire','recipient',d.email,'email','readonly','full')+field('Objet','subject',subject,'text','','full')+'</div>'+'<p><textarea id="emailBody" style="min-height:260px">'+esc(body)+'</textarea></p><div class="actions"><button class="primary" id="sendNow" '+(canSend?'':'disabled')+'>Envoyer</button><button id="copyEmail">Copier</button><button id="saveDraft">Enregistrer le brouillon</button>'+(isQuote?'<button id="recordEmail">Relance envoyée ailleurs</button>':'')+'</div>'+(isQuote?'<div class="actions"><button id="delay">Reporter de 7 jours</button><button id="stop">Suspendre la séquence</button><button id="reply">Réponse client reçue</button></div>':'')+'<p class="sub">Les réponses du client arrivent directement dans votre boîte mail. Pensez à cliquer « Réponse client reçue » pour arrêter les relances.</p><p><button id="back">← Retour à la fiche</button></p></div>';
  if(!$('#modal').open)$('#modal').showModal();
  $('#modal [data-close]').onclick=()=>$('#modal').close();$('#back').onclick=()=>open(d.id);
  $('#sendNow').onclick=async e=>{const s=$('#f-subject').value.trim(),b=$('#emailBody').value;if(!s||!b.trim())return toast('Objet et message requis.');if(!confirm('Envoyer cet email à '+d.email+' ?'))return;e.target.disabled=true;e.target.textContent='Envoi…';
    try{await api('/api/send-email',{leadId:d.id,subject:s,body:b,isReminder:isQuote});await loadAll();$('#modal').close();render();toast('Email envoyé à '+d.email)}catch(err){e.target.disabled=false;e.target.textContent='Envoyer';toast(err.message)}};
  $('#copyEmail').onclick=async()=>{try{await navigator.clipboard.writeText('À : '+d.email+'\nObjet : '+$('#f-subject').value+'\n\n'+$('#emailBody').value);toast('Message copié')}catch(e){$('#emailBody').select();toast('Copie manuelle : Ctrl+C ou ⌘C.')}};
  $('#saveDraft').onclick=async()=>{if(await persist(d,{draft:$('#emailBody').value},'Brouillon enregistré'))toast('Brouillon conservé')};
  if(!isQuote)return;
  $('#recordEmail').onclick=async()=>{if(!confirm('Confirmez-vous avoir envoyé cette relance depuis votre messagerie ?'))return;if(await persist(d,{lastReminder:today(),reminderOverride:'',reminders:d.reminders+1,draft:''},'Relance '+n+' envoyée hors plateforme · déclarée manuellement')){$('#modal').close();render();toast('Envoi externe enregistré')}};
  $('#delay').onclick=async()=>{if(!due(d))return toast('Aucune échéance de relance active.');if(await persist(d,{reminderOverride:shift(7,due(d)>today()?due(d):today())},'Relance reportée de 7 jours')){$('#modal').close();render()}};
  $('#stop').onclick=async()=>{if(await persist(d,{suspended:true},'Séquence de relance suspendue')){$('#modal').close();render()}};
  $('#reply').onclick=async()=>{if(await persist(d,{suspended:true,status:'Échange en cours'},'Réponse client reçue · relances suspendues')){$('#modal').close();render()}}}

// ---------- Nouvelle demande ----------
function add(){$('#modalContent').innerHTML='<div class="modalhead"><h2 style="margin:0">Nouvelle demande</h2><button data-close aria-label="Fermer">✕</button></div><div class="modalbody"><form id="newForm"><div class="fields">'+field('Nom du client','name','')+field('Nom du projet','project','')+field('Email','email','','email')+field('Téléphone','phone','','tel')+field('Localité','city','')+'<div class="field"><label>Type de projet</label><select name="type">'+options(types,'Portail')+'</select></div><div class="field full"><label>Description</label><textarea name="message"></textarea></div></div><p><button class="primary">Créer le dossier</button></p></form></div>';
  $('#modal').showModal();$('#modal [data-close]').onclick=()=>$('#modal').close();
  $('#newForm').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(!v.name.trim()||!v.project.trim())return toast('Renseignez le client et le projet.');
    const{data,error}=await sb.from('leads').insert(toDb({...v,status:'Nouvelle demande',source:'Ajout manuel',owner:'Ferroxwood',created:today()})).select().single();
    if(error)return toast('Erreur : '+error.message);
    await sb.from('lead_events').insert({lead_id:data.id,text:'Demande ajoutée manuellement',author:session.user.email});
    const d=fromRow(data,[]);d.history=[{at:new Date().toISOString(),text:'Demande ajoutée manuellement',author:session.user.email}];db.unshift(d);$('#modal').close();go('Demandes');toast('Demande créée')}}

function download(content,name,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function bind(){
  document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>go('Demandes',b.dataset.filter));
  bindRows();$('#add').onclick=add;$('#logout').onclick=()=>sb.auth.signOut();
  $('#refresh').onclick=async()=>{await loadAll();render();toast('Données actualisées')};
  if($('#search')){$('#search').oninput=e=>{query=e.target.value;refreshResults()};$('#status').onchange=e=>{filter=e.target.value;refreshResults()};$('#source').onchange=e=>{source=e.target.value;refreshResults()};$('#sort').value=sort;$('#sort').onchange=e=>{sort=e.target.value;refreshResults()};$('#mode').onclick=()=>{mode=mode==='table'?'kanban':'table';render()};
    $('#export').onclick=()=>{const keys=['code','name','project','source','status','email','phone','city','budget','amount','ref','sent','reminders','next','action','created'];const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';download('﻿'+[keys.join(';'),...selected().map(d=>keys.map(k=>cell(d[k])).join(';'))].join('\r\n'),'Ferroxwood_demandes.csv','text/csv;charset=utf-8')}}
  if($('#settingsForm')){$('#settingsForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),v=Object.fromEntries(f);
      const row={first_delay:Math.max(1,Math.round(Number(v.first)||7)),second_delay:Math.max(1,Math.round(Number(v.second)||7)),auto_send:f.has('auto_send'),attach_pdf:f.has('attach_pdf'),notify_email:v.notify_email.trim()||null,signature:v.signature,subject_1:v.subject_1,body_1:v.body_1,subject_2:v.subject_2,body_2:v.body_2};
      if(row.auto_send&&!config.auto_send&&!confirm('Activer l’envoi automatique ? Les relances dues partiront sans validation lors du prochain passage.'))return;
      const{error}=await sb.from('settings').update(row).eq('id',1);if(error)return toast('Erreur : '+error.message);
      config={...config,...row,first:row.first_delay,second:row.second_delay};render();toast('Paramètres enregistrés')};
    $('#runNow').onclick=async e=>{e.target.disabled=true;try{const r=await api('/api/cron/reminders');await loadAll();render();toast(r.due+' relance(s) due(s) · '+r.sent+' envoyée(s)'+(r.failed?' · '+r.failed+' échec(s)':''))}catch(err){e.target.disabled=false;toast(err.message)}}}
}
function bindRows(){document.querySelectorAll('[data-open]').forEach(b=>{b.onclick=()=>open(b.dataset.open);if(b.tagName==='TR')b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(b.dataset.open)}}});document.querySelectorAll('[data-draft]').forEach(b=>b.onclick=()=>{$('#modal').showModal();draft(b.dataset.draft)})}
function refreshResults(){$('#results').innerHTML=results();bindRows()}
window.addEventListener('focus',()=>{if(session&&allowed&&Date.now()-lastLoad>60000&&!$('#modal').open)loadAll().then(render)});
boot();
</script></body></html>
